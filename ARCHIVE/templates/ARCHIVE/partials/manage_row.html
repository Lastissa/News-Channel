{% load archive_extras %}
<button type="button"
        class="studio-tile{% if editor_item and editor_item.id == item.id %} is-selected{% endif %}"
        id="archive-manage-row-{{ item.id }}" data-studio-tile
        hx-get="{% url 'archive:item_edit' item.id %}"
        hx-target="#archive-editor" hx-swap="innerHTML"
        hx-vals='{"descr": "{{ descr|escapejs }}", "date": "{{ date|escapejs }}", "show": "{{ show|escapejs }}"}'
        aria-label="Edit: {{ item.alt }}">
  <span class="studio-tile-media{% if item.kind == 'file' %} is-file{% endif %}">
    {% with proxied_url=item.url|cloudinary_proxy %}
    {% if item.kind == 'image' %}
    <img src="{{ proxied_url }}" alt="" loading="lazy" onerror="this.onerror=null;this.src='/static/404.jpg';">
    {% elif item.is_video %}
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
    {% else %}
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    {% endif %}
    {% endwith %}
    {% if item.is_private %}<span class="archive-private-badge">Only me</span>{% endif %}
  </span>
  <span class="studio-tile-text">
    <span class="studio-tile-title">{{ item.alt }}</span>
    <span class="studio-tile-meta">{% if item.kind == "image" %}{{ item.width }}&times;{{ item.height }}{% elif item.is_video %}Video &middot; {{ item.file_size_label }}{% else %}{{ item.file_extension|upper|default:"File" }} &middot; {{ item.file_size_label }}{% endif %} &middot; {{ item.date_created|date:"j M" }}</span>
  </span>
</button>
