<div class="archive-modal-layer" data-archive-modal role="presentation">
  <div class="archive-modal-backdrop" data-archive-modal-close></div>
  <div class="archive-modal-card" role="dialog" aria-modal="true" aria-labelledby="archive-modal-title">
    <div class="archive-modal-head">
      <h3 id="archive-modal-title">Add image or file</h3>
      <button type="button" class="archive-modal-close" data-archive-modal-close aria-label="Close">&times;</button>
    </div>

    <p class="archive-modal-error" data-archive-upload-error hidden></p>

    <form data-archive-upload-form data-endpoint="{% url 'archive:upload' %}">
      {% csrf_token %}
      <div class="archive-modal-field">
        <label for="archive-upload-file">Picture or file (from your phone or device)</label>
        <input id="archive-upload-file" type="file" name="upload_file"
               accept="image/jpeg,image/png,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.rtf,.zip,.rar,.7z,.mp3,.wav,.mp4,.mov,.json"
               required data-archive-upload-file>
        <div class="archive-modal-preview" data-archive-upload-preview hidden>
          <img data-archive-upload-preview-img alt="Selected picture preview">
          <div class="archive-modal-preview-file" data-archive-upload-preview-file hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-archive-upload-preview-filename></span>
          </div>
        </div>
      </div>

      <div class="archive-modal-row" data-archive-image-only>
        <div class="archive-modal-field">
          <label for="archive-upload-width">Width (px)</label>
          <input id="archive-upload-width" type="number" name="width" min="50" max="4000">
        </div>
        <div class="archive-modal-field">
          <label for="archive-upload-height">Height (px)</label>
          <input id="archive-upload-height" type="number" name="height" min="50" max="4000">
        </div>
      </div>

      <div class="archive-modal-field" data-archive-image-only>
        <label for="archive-upload-quality">Quality</label>
        <select id="archive-upload-quality" name="quality">
          {% for value, label in quality_choices %}
          <option value="{{ value }}" {% if value == default_quality %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="archive-modal-field">
        <label for="archive-upload-alt">Description</label>
        <input id="archive-upload-alt" type="text" name="alt" maxlength="150"
               placeholder="Short description of the picture or file" required>
      </div>

      <div class="archive-modal-actions">
        <button type="button" class="archive-action-btn" data-archive-modal-close>Cancel</button>
        <button type="submit" class="archive-action-btn primary" data-archive-upload-submit>Upload</button>
      </div>
    </form>
  </div>
</div>
