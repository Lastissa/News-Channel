{% load custom_tag %}

{% for post in page_obj.object_list %}
<article class="story-card">
  <a class="story-card-media" href="{% url 'blog:story_detail' post.id %}" tabindex="-1">
    <img src="{{ post.image_1|default:'https://placehold.co/640x400/1F2A37/F6F3ED?text=%20' }}" alt="abureport news placeholder image" loading="lazy">
  </a>
  <div class="story-card-body">
    <div class="story-card-meta">
      <a class="tag" href="{% url 'home:home' %}?category={{ post.category }}">{{ post.get_category_display|title }}</a>
      <span class="meta-divider" aria-hidden="true"></span>
      <span class="meta-time">{{ post.date_created|timesince }} ago</span>
    </div>
    <h3 class="story-card-title"><a href="{% url 'blog:story_detail' post.id %}">{{ post.heading }}</a></h3>
    <p class="story-card-excerpt">{{ post.content|truncatewords:22 }}</p>
    <div class="story-card-footer">
      <span class="story-card-byline">{{ post.author.staffprofile.full_name|slice:":20"|default:"UNKNOWN" }}</span>
      <button type="button"
              class="bookmark-chip"
              data-bookmark-btn
              data-blog-id="{{ post.id }}"
              data-endpoint="{% url 'home:bookmark' post.id %}"
              data-saved="{% if post.id in saved_ids %}true{% else %}false{% endif %}"
              aria-pressed="{% if post.id in saved_ids %}true{% else %}false{% endif %}"
              aria-label="Save story">
        <svg viewBox="0 0 20 20" class="bookmark-icon" aria-hidden="true">
          <path d="M5 3.5h10a1 1 0 011 1V18l-6-3.6L4 18V4.5a1 1 0 011-1z" fill="{% if post.id in saved_ids %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</article>
{% endfor %}
<div class="page-meta" data-has-more="{% if page_obj.has_next %}true{% else %}false{% endif %}" data-next-page="{% if page_obj.has_next %}{{ page_obj.next_page_number }}{% else %}{{ page_obj.number }}{% endif %}" hidden></div>
