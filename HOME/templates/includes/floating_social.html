{% comment %}
TO ADD ANOTHER ICON LATER:
1. Add the link/handle to SERVICE_INTERNAL/config.py's About class and to
   custom_context_processors() so it's available as a template variable.
2. Duplicate one <a class="fab-btn" ...> block below, swap the href and the
   <svg> icon.
3. No CSS changes needed -- .fab-stack lays out children automatically.
{% endcomment %}
<div class="fab-stack" aria-label="Contact us on social media">
  <a class="fab-btn fab-whatsapp" href="{{ whatsapp }}" target="_self" rel="noopener noreferrer" aria-label="Chat with us on WhatsApp">
