{% comment %} Inline above-the-fold CSS. base.css is deliberately non-blocking, so this
   tiny subset paints the header, hero and story-grid shell before the full
   stylesheet arrives. Keep it small: every byte here is part of the HTML. {% endcomment %}
<style id="critical-css">
:root{
  --nav-bg:#0E1B2C;--nav-fg:#F6F3ED;--surface:#fff;--paper-dim:#fefbff;
  --ink-soft:#1F2A37;--amber-deep:#8a5600;--radius-s:6px;--header-h:64px;
  --font-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-display:var(--font-body);--shadow-card:0 1px 2px rgba(14,27,44,.07);
}
html[data-theme="dark"]{
  --nav-bg:#0E1B2C;--nav-fg:#F6F3ED;--surface:#121F30;--paper-dim:#101C2C;
  --ink-soft:#D8D2C4;--amber-deep:#EDB35A;--shadow-card:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{background-color:var(--paper);scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-body);color:var(--ink);margin:0 0 12px;font-weight:700}
p{margin:0 0 16px}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font-family:inherit;cursor:pointer}
:focus-visible{outline:1.5px solid var(--amber-deep);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.site-header{position:sticky;top:0;z-index:100;background:var(--nav-bg);border-bottom:1px solid var(--slate)}
.header-bar{max-width:1180px;margin:0 auto;padding:0 20px;height:var(--header-h);display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{border-radius:var(--radius-s)}
.brand-word{font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--nav-fg);letter-spacing:.01em}
.primary-nav{display:none;flex:1}
.header-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.hero-row{display:flex;align-items:stretch;width:100%}
.hero{position:relative;overflow:hidden;background:var(--nav-bg);border-bottom-left-radius:25px;width:70vw;height:70vh;min-height:400px;max-height:640px}
.hero-track{position:relative;height:100%;background:var(--nav-bg)}
.hero-slide{position:absolute;inset:0;background-color:var(--nav-bg);background-image:var(--slide-image),radial-gradient(120% 120% at 50% 20%,#16283f 0%,var(--nav-bg) 70%);background-size:cover,auto;background-position:center,center;background-repeat:no-repeat,no-repeat;opacity:0;visibility:hidden;display:flex;align-items:flex-end}
.hero-slide.is-active{opacity:1;visibility:visible}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,27,44,.05) 0%,rgba(14,27,44,.55) 55%,rgba(14,27,44,.92) 100%)}
.hero-slide-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-content{position:relative;z-index:2;padding:32px 20px 96px;max-width:720px;pointer-events:none}
.hero-content a,.hero-content button{pointer-events:auto}
.hero-label{display:flex;align-items:center;gap:8px;color:var(--amber);font-weight:800;font-size:.85rem;margin-bottom:10px}
.hero-label .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.hero-headline{color:#FAF8F3;font-size:clamp(1.65rem,4vw,2.35rem);line-height:1.14;margin-bottom:10px;overflow-wrap:break-word;text-wrap:balance}
.hero-headline a{color:inherit}
.hero-byline{color:rgba(250,248,243,.75);font-size:.92rem;margin-bottom:20px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.glass-btn{padding:10px 20px;font-weight:600;font-size:.92rem;background:rgba(255,255,255,.16);color:#FAF8F3;border-left:none;border-top:none;border-right:1px solid #fff;border-bottom:1px solid #fff}
.glass-btn-icon{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.hero-controls{position:absolute;left:0;right:0;bottom:18px;z-index:3;display:flex;align-items:center;justify-content:center;gap:18px}
.hero-arrow{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center}
.hero-dots{display:flex;align-items:center;gap:8px}
.hero-dot{position:relative;width:24px;height:24px;padding:0;border:none;border-radius:999px;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.hero-dot::before{content:"";width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.4);transition:background .2s ease,width .25s ease}
.hero-dot.is-active{width:34px}
.hero-dot.is-active::before{background:var(--amber);width:26px}
.story-grid-section{margin:0 auto;padding:30px 20px 12px}
.section-heading{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.section-heading h1,.section-heading h2{flex:0 0 auto;margin:0;padding:7px 24px;font-size:24px;line-height:1.2;background:var(--nav-bg);color:var(--nav-fg);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.story-grid{display:grid;grid-template-columns:1fr;gap:22px}
.story-card{background:transparent;border:none;border-radius:0;overflow:visible;display:flex;flex-direction:column;box-shadow:none}
.story-card-media{position:relative;aspect-ratio:16/10;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,var(--surface) 0%,var(--paper-dim) 100%)}
.story-card-media img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}
.story-card-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.story-card-title{font-size:18.5px;line-height:1.3;margin-bottom:0}
.story-card-excerpt{color:var(--ink);font-size:.92rem;margin-bottom:0;flex:1}
.skeleton,.skeleton-media,.skeleton-line{display:block;background:linear-gradient(100deg,var(--paper-dim) 20%,var(--line) 40%,var(--paper-dim) 60%);background-size:200% 100%;animation:skeleton-shimmer 1.1s linear infinite}
.skeleton-media{aspect-ratio:16/10}.skeleton-line{height:14px;border-radius:4px}
@keyframes skeleton-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media (max-width:899px){.hero-row{flex-direction:column}.hero{width:100%;height:45vh;min-height:0;max-height:none}}
@media (max-width:640px){.hero-headline{font-size:clamp(1.5rem,7vw,1.9rem);line-height:1.16}}
@media (min-width:640px){.story-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.hero-content{padding:40px 60px 110px}}
@media (min-width:1024px){.story-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:899.98px){.hero-arrow{width:44px;height:44px}.hero-controls{gap:8px}.hero-dots{gap:4px}.hero-dot{width:36px;height:44px}.hero-dot.is-active{width:44px}.hero-dot::before{width:12px;height:12px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.skeleton,.skeleton-media,.skeleton-line{animation:none}}
</style>
